# Forensic Platform — Grafana (généré par scripts/generate-grafana-ini.sh)
# Les variables GF_* dans docker-compose priment si définies.

[server]
protocol = http
domain = 192.168.2.67
root_url = https://192.168.2.67/grafana/
serve_from_sub_path = true
enforce_domain = false

[security]
allow_embedding = true
cookie_secure = true
cookie_samesite = none
csrf_trusted_origins = https://192.168.2.67,http://192.168.2.67,https://localhost,http://localhost,https://127.0.0.1,http://127.0.0.1

[live]
allowed_origins = https://192.168.2.67,http://192.168.2.67,https://localhost,http://localhost,https://127.0.0.1,http://127.0.0.1

[cors]
enabled = true
allow_credentials = true
allow_origin = https://192.168.2.67,http://192.168.2.67,https://localhost,http://localhost

[users]
allow_sign_up = false

[auth.anonymous]
enabled = true
org_role = Admin
