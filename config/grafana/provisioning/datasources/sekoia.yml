apiVersion: 1

datasources:
  - name: OpenSearch-Sekoia
    type: grafana-opensearch-datasource
    uid: sekoia-volumetry
    access: proxy
    url: http://opensearch-node1:9200
    isDefault: false
    jsonData:
      # Indices écrits par sekoia-monitor (volumétrie, intakes, alertes ingestion)
      database: "sekoia-*"
      timeField: "@timestamp"
      version: "2.12.0"
      flavor: OpenSearch
      pplEnabled: false
      maxConcurrentShardRequests: 5
