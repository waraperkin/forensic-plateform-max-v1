# Chemins absolus émis par MISP (formulaires sans préfixe /misp/)
proxy_set_header Host               $http_host;
proxy_set_header X-Forwarded-Host   $http_host;
proxy_set_header X-Forwarded-Proto  https;
proxy_set_header X-Forwarded-Port   $fp_forwarded_port;
proxy_set_header Upgrade            $http_upgrade;
proxy_set_header Connection         $conn_upgrade;
# MISP.baseurl porte l'URL canonique — proxy_redirect ciblé dans forensic.conf (location /users/login)
proxy_redirect off;
# MISP CSRF : Referer canonique (évite mismatch client vs MISP.baseurl)
proxy_set_header Referer $misp_referer_fallback;
proxy_read_timeout 300s;
