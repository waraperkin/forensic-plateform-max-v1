# Chemins absolus émis par MISP (formulaires sans préfixe /misp/)
proxy_set_header Host               $http_host;
proxy_set_header X-Forwarded-Host   $http_host;
proxy_set_header X-Forwarded-Proto  https;
proxy_set_header X-Forwarded-Port   $fp_forwarded_port;
proxy_set_header X-Forwarded-Prefix /misp;
proxy_set_header Upgrade            $http_upgrade;
proxy_set_header Connection         $conn_upgrade;
proxy_redirect off;
# MISP CSRF : conserver le Referer navigateur ; fallback canonique si absent
proxy_set_header Referer $misp_referer_final;
proxy_read_timeout 300s;
